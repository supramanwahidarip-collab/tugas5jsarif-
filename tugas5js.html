<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
//FOR LOOP

for (let i = 1; i <= 10; i++) {
    console.log(i);
}

console.log("---"); // Pemisah opsional

for (let j = 5; j >= 1; j--) {
    console.log(j);
}

console.log("---"); // Pemisah opsional

console.log("Mulai!");

console.log("---"); // Pemisah opsional

//WHILE LOOP

let angka = 1;
let total = 0;

while (angka <= 5) {
    total += angka; 
    angka++;        
}
console.log("Total akumulasi:", total);

    </script>
</body>
</html>
